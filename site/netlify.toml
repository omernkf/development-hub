[build]
  publish = "."
  command = "echo 'Static site - no build required'"

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
